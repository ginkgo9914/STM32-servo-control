<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频播放</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }
    video {
      max-width: 100%;
      max-height: 100vh;
    }
    .hint {
      color: #888;
      font-size: 14px;
      margin-top: 12px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <video controls preload="metadata">
    <source src="video.mp4" type="video/mp4">
    你的浏览器不支持视频播放。
  </video>
  <p class="hint">点击播放按钮开始观看</p>
</body>
</html>
